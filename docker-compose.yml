services:
  julius:
    # Published by GitHub Actions. `docker compose pull` fetches it; `--build` builds locally instead.
    image: ghcr.io/danielgratzl/julius:latest
    build: .
    container_name: julius
    ports:
      - "3000:3000"
    environment:
      TZ: Europe/Zurich
      # Set to "true" once to explore the app with an example household (only fills an empty database)
      SEED_DEMO: "false"
    volumes:
      - julius-data:/app/data
    restart: unless-stopped

volumes:
  julius-data:
